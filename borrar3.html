<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login con Foto Grande</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #f5b841 35%, #2e2a55 65%);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #f0f0f0;
  }

  .container {
    width: 480px;
    background: #2e2a55;
    border-radius: 40px 40px 60px 20px;
    box-shadow:
      0 20px 50px rgba(0,0,0,0.6),
      inset 0 -10px 30px #3a3676;
    padding: 60px 50px 80px;
    text-align: center;
    position: relative;
    overflow: visible;
  }

  h2 {
    font-weight: 700;
    font-size: 2.8rem;
    margin-bottom: 45px;
  }

  /* Paso 1 y 2 */
  .step {
    display: none;
    flex-direction: column;
    align-items: center;
  }

  .step.active {
    display: flex;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 22px 28px;
    font-size: 1.4rem;
    border-radius: 35px;
    border: none;
    outline: none;
    background: #3a3676;
    color: #f0f0f0;
    box-shadow: inset 0 3px 12px rgba(0,0,0,0.5);
    margin-bottom: 32px;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  input[type="text"]:focus, input[type="password"]:focus {
    background: #4c4a93;
    box-shadow:
      inset 0 5px 15px rgba(83,109,253,0.95),
      0 0 12px #536dfdaa;
  }

  button {
    background: #3a3676;
    border: none;
    color: #f0f0f0;
    font-weight: 700;
    padding: 22px 40px;
    border-radius: 35px;
    cursor: pointer;
    box-shadow:
      0 8px 22px #2b2960,
      inset 0 -4px 12px #4c4a93;
    transition: background 0.3s ease, box-shadow 0.3s ease;
    font-size: 1.5rem;
    width: 100%;
  }

  button:hover {
    background: #536dfd;
    box-shadow:
      0 14px 32px #536dfd,
      inset 0 -5px 14px #3a43c3;
  }

  /* Perfil + esferas */
  .profile-container {
    position: relative;
    width: 180px;
    height: 180px;
    margin-bottom: 55px;
  }

  .profile-container img {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 14px 25px rgba(255 255 255 / 0.15);
    z-index: 10;
    position: relative;
  }

  .sphere {
    position: absolute;
    border-radius: 50%;
    opacity: 0.9;
    box-shadow: 0 8px 18px rgba(0,0,0,0.3);
  }

  .sphere.red {
    background: #f44336;
    width: 48px;
    height: 48px;
    top: 20%;
    left: -28%;
    animation: floatAround 6.5s ease-in-out infinite;
    animation-delay: 0s;
  }

  .sphere.yellow {
    background: #f5b841;
    width: 68px;
    height: 68px;
    top: 68%;
    right: -34%;
    animation: floatAround 8s ease-in-out infinite;
    animation-delay: 2.2s;
  }

  .sphere.blue {
    background: #536dfd;
    width: 36px;
    height: 36px;
    top: 12%;
    right: 22%;
    animation: floatAround 5.5s ease-in-out infinite;
    animation-delay: 1.1s;
  }

  @keyframes floatAround {
    0%, 100% {
      transform: translateY(0) translateX(0);
      opacity: 0.9;
    }
    50% {
      transform: translateY(-18px) translateX(9px);
      opacity: 1;
    }
  }

  .delete-account {
    color: #8a8a8a;
    font-size: 1.1rem;
    cursor: pointer;
    transition: color 0.3s ease;
    user-select: none;
    margin-top: 25px;
  }

  .delete-account:hover {
    color: #f44336;
  }
</style>
</head>
<body>

<div class="container" role="main" aria-label="Formulario de selección de usuario y login">

  <!-- Paso 1: ¿Quién eres? -->
  <div class="step active" id="step-1">
    <h2>¿Quién va a entrar?</h2>
    <input type="text" id="input-username" placeholder="Escribe tu usuario" aria-label="Ingrese su nombre de usuario" autocomplete="username" />
    <button id="btn-next">Continuar</button>
  </div>

  <!-- Paso 2: Login con foto -->
  <div class="step" id="step-2" aria-live="polite" aria-atomic="true">
    <h2>Welcome back!</h2>
    <div class="profile-container" aria-label="Foto de usuario con esferas animadas">
      <img id="user-photo" src="https://randomuser.me/api/portraits/men/75.jpg" alt="Foto de usuario" />
      <div class="sphere red" aria-hidden="true"></div>
      <div class="sphere yellow" aria-hidden="true"></div>
      <div class="sphere blue" aria-hidden="true"></div>
    </div>

    <form aria-label="Formulario de inicio de sesión">
      <label for="password" style="display:none;">Password</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
      <button type="submit" aria-label="Iniciar sesión">LOGIN</button>
    </form>

    <div class="delete-account" role="button" tabindex="0" aria-label="Eliminar cuenta">
      DELETE ACCOUNT
    </div>
  </div>

</div>

<script>
  const fakeUserPhotos = {
    chester: 'https://randomuser.me/api/portraits/men/75.jpg',
    maria: 'https://randomuser.me/api/portraits/women/65.jpg',
    juan: 'https://randomuser.me/api/portraits/men/15.jpg'
  };

  const step1 = document.getElementById('step-1');
  const step2 = document.getElementById('step-2');
  const btnNext = document.getElementById('btn-next');
  const inputUsername = document.getElementById('input-username');
  const userPhoto = document.getElementById('user-photo');

  btnNext.addEventListener('click', () => {
    let username = inputUsername.value.trim().toLowerCase();

    if (!username) {
      alert('Por favor, ingresa tu usuario');
      return;
    }

    userPhoto.src = fakeUserPhotos[username] || 'https://randomuser.me/api/portraits/lego/1.jpg';
    userPhoto.alt = `Foto de usuario ${username}`;

    step1.classList.remove('active');
    step2.classList.add('active');
  });
</script>

</body>
</html>
