<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login Animado Profesional</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

  /* Reset y base */
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }

  body, html {
    height: 100%;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #f5b841 35%, #2e2a55 65%);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #f0f0f0;
  }

  /* Contenedor de la tarjeta */
  .login-card {
    background: #2e2a55;
    width: 400px;
    border-radius: 30px 30px 50px 10px;
    box-shadow:
      0 15px 35px rgba(0, 0, 0, 0.5),
      inset 0 -5px 20px #3a3676;
    padding: 50px 40px 70px;
    position: relative;
    overflow: visible;
    text-align: center;
    
  }

  /* Título */
  .login-card h2 {
    font-weight: 700;
    font-size: 2.2rem;
    margin-bottom: 35px;
  }

  /* Contenedor imagen + esferas */
  .profile-container {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 40px;
  }

  .profile-container img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 10px 15px rgba(255 255 255 / 0.1);
    z-index: 10;
    position: relative;
  }

  /* Esferas animadas alrededor */
  .sphere {
    position: absolute;
    border-radius: 50%;
    opacity: 0.85;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
  }

  .sphere.red {
    background: #f44336;
    width: 36px;
    height: 36px;
    top: 22%;
    left: -20%;
    animation: floatAround 6s ease-in-out infinite;
    animation-delay: 0s;
  }

  .sphere.yellow {
    background: #f5b841;
    width: 48px;
    height: 48px;
    top: 70%;
    right: -28%;
    animation: floatAround 7s ease-in-out infinite;
    animation-delay: 2s;
  }

  .sphere.blue {
    background: #536dfd;
    width: 26px;
    height: 26px;
    top: 12%;
    right: 18%;
    animation: floatAround 5s ease-in-out infinite;
    animation-delay: 1s;
  }

  @keyframes floatAround {
    0%, 100% {
      transform: translateY(0) translateX(0);
      opacity: 0.85;
    }
    50% {
      transform: translateY(-14px) translateX(7px);
      opacity: 1;
    }
  }

  /* Formularios */
  form {
    display: flex;
    flex-direction: column;
    gap: 25px;
  }

  label {
    text-align: left;
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 8px;
    user-select: none;
  }

  input[type="text"],
  input[type="password"] {
    padding: 18px 20px;
    font-size: 1.1rem;
    border-radius: 30px;
    border: none;
    outline: none;
    background: #3a3676;
    color: #f0f0f0;
    box-shadow:
      inset 0 2px 8px rgba(0,0,0,0.4);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    background: #4c4a93;
    box-shadow:
      inset 0 3px 12px rgba(83,109,253,0.9),
      0 0 8px #536dfdaa;
  }

  /* Botón login */
  .btn-login {
    background: #3a3676;
    border: none;
    color: #f0f0f0;
    font-weight: 700;
    padding: 18px 35px;
    border-radius: 30px;
    cursor: pointer;
    box-shadow:
      0 6px 15px #2b2960,
      inset 0 -3px 8px #4c4a93;
    transition: background 0.3s ease, box-shadow 0.3s ease;
    font-size: 1.2rem;
    margin-top: 10px;
  }

  .btn-login:hover {
    background: #536dfd;
    box-shadow:
      0 10px 25px #536dfd,
      inset 0 -3px 10px #3a43c3;
  }

  /* Link de borrar */
  .delete-account {
    color: #8a8a8a;
    font-size: 0.9rem;
    cursor: pointer;
    transition: color 0.3s ease;
    user-select: none;
    margin-top: 18px;
  }

  .delete-account:hover {
    color: #f44336;
  }

  /* Responsive */
  @media (max-width: 430px) {
    .login-card {
      width: 90vw;
      padding: 40px 20px 60px;
    }
    .profile-container {
      width: 110px;
      height: 110px;
    }
    .profile-container img {
      width: 110px;
      height: 110px;
    }
    .btn-login {
      font-size: 1rem;
      padding: 15px 25px;
    }
    input[type="text"],
    input[type="password"] {
      font-size: 1rem;
      padding: 14px 18px;
    }
  }
</style>
</head>
<body>

<div class="login-card" role="main" aria-label="Login form">

  <h2>Welcome back!</h2>

  <div class="profile-container" aria-label="User profile picture with animated orbs">
    <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="Foto de usuario Chester" />
    <div class="sphere red" aria-hidden="true"></div>
    <div class="sphere yellow" aria-hidden="true"></div>
    <div class="sphere blue" aria-hidden="true"></div>
  </div>

  <form aria-label="Formulario de inicio de sesión">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" placeholder="Escribe tu usuario" required autocomplete="username" />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" />

    <button class="btn-login" type="submit" aria-label="Iniciar sesión">LOGIN AS CHESTER</button>
  </form>

  <div class="delete-account" role="button" tabindex="0" aria-label="Eliminar cuenta">
    DELETE ACCOUNT
  </div>

</div>

</body>
</html>
