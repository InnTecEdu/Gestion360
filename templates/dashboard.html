{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}

<style>
.dashboard-wrapper {
    min-height: 85vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: none;
}

.dashboard-title {
    text-align: center;
    color: #222;
    font-weight: 600;
    margin-bottom: 50px;
}

.custom-card {
    background: #fff;
    border-radius: 20px;
    padding: 45px 35px;
    text-align: center;
    color: #222;
    position: relative;
    box-shadow: 0 8px 32px rgba(60,60,100,0.10);
    border: 1px solid #e0e7ef;
    transition: all 0.35s ease;
}

.custom-card:hover {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 16px 40px rgba(60,60,100,0.18);
}
.custom-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 28px;
    padding: 1px;
    background: #00aab1;
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    opacity: 0.4;
}

.custom-btn {
    margin-top: 25px;
    padding: 12px 35px;
    border-radius: 50px;
    border: none;
    font-weight: 500;
    transition: 0.3s ease;
}

.btn-primary-custom {
    background: linear-gradient(90deg,#00aab1,#00aab160);
    color: #222;
    border: none;
}

.btn-accent {
    background: #00aab1; color: #00aab160;
    color: #222;
    border: none;
}

.btn-dark-custom {
    background: #00aab1; color: #00aab160;
    color: #222;
    border: none;
}

.custom-btn:hover {
    opacity: 0.9;
    transform: scale(1.05);
}
</style>

<div class="container dashboard-wrapper">

    <h2 class="dashboard-title">Panel Principal</h2>

    <div class="row g-4 justify-content-center">

        <!-- Subir Documento -->
        <div class="col-md-4">
            <div class="custom-card h-100">
                <h4>📤 Subir Documento</h4>
                <a href="{{ url_for('document.subir') }}"
                   class="btn custom-btn btn-primary-custom">
                    Ir
                </a>
            </div>
        </div>

        <!-- Buscar Documento -->
        <div class="col-md-4">
            <div class="custom-card h-100">
                <h4>🔎 Buscar Documentos</h4>
                <a href="{{ url_for('document.buscar') }}"
                   class="btn custom-btn btn-accent">
                    Buscar
                </a>
            </div>
        </div>

        <!-- Gestión Usuarios SOLO ADMIN -->
        {% if current_user.rol == 'admin' %}
        <div class="col-md-4">
            <div class="custom-card h-100">
                <h4>👥 Gestión de Usuarios</h4>
                <a href="{{ url_for('user.listar_usuarios') }}"
                   class="btn custom-btn btn-dark-custom">
                    Administrar
                </a>
            </div>
        </div>
        {% endif %}

    </div>
</div>

{% endblock %}
