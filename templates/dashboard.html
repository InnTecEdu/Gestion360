{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}

<style>
.dashboard-wrapper {
    min-height: 85vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.dashboard-title {
    text-align: center;
    color: white;
    font-weight: 600;
    margin-bottom: 50px;
}

.custom-card {
    background: linear-gradient(
        145deg,
        rgb(182, 69, 122),
        rgba(46, 42, 94, 0.95)
    );

    border-radius: 28px;
    padding: 45px 35px;
    text-align: center;
    color: white;
    position: relative;

    box-shadow:
        0 20px 50px rgba(255, 255, 255, 0.5),
        inset 0 1px 1px rgba(255,255,255,0.1);

    border: 1px solid rgba(255, 255, 255, 0.08);

    transition: all 0.35s ease;
}

.custom-card:hover {
    transform: translateY(-10px);
    box-shadow:
        0 30px 60px rgb(42, 23, 83),
        0 0 25px rgb(128, 57, 89);
}
.custom-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 28px;
    padding: 1px;
    background: linear-gradient(135deg, #ffb347, #6a5acd);
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    opacity: 0.4;
}

.custom-btn {
    margin-top: 25px;
    padding: 12px 35px;
    border-radius: 50px;
    border: none;
    font-weight: 500;
    transition: 0.3s ease;
}

.btn-primary-custom {
    background: linear-gradient(90deg,#5a54b3,#4c4693);
    color: white;
}

.btn-accent {
    background: linear-gradient(90deg,#ffb347,#ff9800);
    color: #2e2a5e;
}

.btn-dark-custom {
    background: #2e2a5e;
    color: white;
}

.custom-btn:hover {
    opacity: 0.9;
    transform: scale(1.05);
}
</style>

<div class="container dashboard-wrapper">

    <h2 class="dashboard-title">Panel Principal</h2>

    <div class="row g-4 justify-content-center">

        <!-- Subir Documento -->
        <div class="col-md-4">
            <div class="custom-card h-100">
                <h4>📤 Subir Documento</h4>
                <a href="{{ url_for('document.subir') }}"
                   class="btn custom-btn btn-primary-custom">
                    Ir
                </a>
            </div>
        </div>

        <!-- Buscar Documento -->
        <div class="col-md-4">
            <div class="custom-card h-100">
                <h4>🔎 Buscar Documentos</h4>
                <a href="{{ url_for('document.buscar') }}"
                   class="btn custom-btn btn-accent">
                    Buscar
                </a>
            </div>
        </div>

        <!-- Gestión Usuarios SOLO ADMIN -->
        {% if current_user.rol == 'admin' %}
        <div class="col-md-4">
            <div class="custom-card h-100">
                <h4>👥 Gestión de Usuarios</h4>
                <a href="{{ url_for('user.listar_usuarios') }}"
                   class="btn custom-btn btn-dark-custom">
                    Administrar
                </a>
            </div>
        </div>
        {% endif %}

    </div>
</div>

{% endblock %}
