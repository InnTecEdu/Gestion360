<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

  body, html {
    height: 100%;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #00aab1 60%, #e0e7ef 100%); color: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #f0f0f0;
    margin: 0;
  }

  .container {
    position: relative;
    display:flex;
    align-items: center;
    justify-content: center;
    width: 400px;
    height: 600px;
    background: #00aab160; color: #222; border: 1px solid #e0e7ef;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(60,60,100,0.10);
    padding: 80px 40px 70px;
    text-align: center;
    overflow: visible;
  }

  h2 {
    font-weight: 700;
    font-size: 2.2rem;
    margin-bottom: 35px;
  }

  .step {
    display: none;
    flex-direction: column;
    align-items: center;
  }
  .step.active {
    display: flex;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 18px 20px;
    font-size: 1.1rem;
    border-radius: 30px;
    border: none;
    outline: none;
    background: #f8fafc;
    color: #222;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
    margin-bottom: 25px;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  input[type="text"]:focus, input[type="password"]:focus {
    background: #fffde7; color: #222; border: 1px solid #ffd54f;
    box-shadow: inset 0 3px 12px #00aab1, 0 0 8px #00aab160;
  }

  button {
    background: #00aab1;
    border: none;
    color: #f0f0f0;
    font-weight: 700;
    padding: 18px 35px;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 15px #00aab160, inset 0 -3px 8px #00aab1;
    transition: background 0.3s ease, box-shadow 0.3s ease;
    font-size: 1.2rem;
    width: 100%;
  }

  button:hover {
    background: #00aab160;
    box-shadow: 0 10px 25px #00aab160, inset 0 -3px 10px #fff;
  }

  .profile-container {
    position: relative;
    width: 130px;
    height: 130px;
    margin-bottom: 40px;
  }

  .profile-container img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 10px 15px rgba(255 255 255 / 0.1);
    z-index: 10;
    position: relative;
  }

  .sphere {
    position: absolute;
    border-radius: 50%;
    opacity: 0.85;
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
  }

  .sphere.red { background: #f44336; width: 36px; height: 36px; top: 22%; left: -20%; animation: floatAround 6s ease-in-out infinite; animation-delay: 0s; }
  .sphere.yellow { background: #ffe082; width: 48px; height: 48px; top: 70%; right: -28%; animation: floatAround 7s ease-in-out infinite; animation-delay: 2s; }
  .sphere.blue { background: #536dfd; width: 26px; height: 26px; top: 12%; right: 18%; animation: floatAround 5s ease-in-out infinite; animation-delay: 1s; }

  @keyframes floatAround {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.85; }
    50% { transform: translateY(-14px) translateX(7px); opacity: 1; }
  }
</style>
</head>
<body>
<div class="container" role="main">

  <!-- Paso 1: Usuario -->
  <div class="step active" id="step-1">
    <h2>¿Quién va a entrar?</h2>
    <input type="text" id="input-username" name="username" placeholder="Escribe tu usuario" autocomplete="username" />
    <button type="button" id="btn-next">Continuar</button>
  </div>

  <!-- Paso 2: Login -->
  <div class="step" id="step-2">
    <h2>Bienvenid@</h2>
    <div class="profile-container">
      <img id="user-photo" src="https://randomuser.me/api/portraits/lego/1.jpg" alt="Foto de usuario" />
      <div class="sphere red"></div>
      <div class="sphere yellow"></div>
      <div class="sphere blue"></div>
    </div>

    <form method="POST">
      <input type="hidden" id="hidden-username" name="username" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
      <button type="submit">LOGIN</button>
    </form>
  </div>

</div>

<script>
  const step1 = document.getElementById('step-1');
  const step2 = document.getElementById('step-2');
  const btnNext = document.getElementById('btn-next');
  const inputUsername = document.getElementById('input-username');
  const hiddenUsername = document.getElementById('hidden-username');
  const userPhoto = document.getElementById('user-photo');

  btnNext.addEventListener('click', async () => {
    const username = inputUsername.value.trim();
    if (!username) return alert('Ingresa tu usuario');

    // Pedir foto del usuario al backend
    const res = await fetch(`/get_user_photo/${username}`);
    const data = await res.json();

    userPhoto.src = data.foto || '/static/images/default-user.jpg';
    userPhoto.alt = `Foto de ${username}`;
    hiddenUsername.value = username;

    // Mostrar paso 2
    step1.style.display = 'none';
    step2.style.display = 'block';
  });
</script>
</body>
</html>
