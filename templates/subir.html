{% extends "base.html" %}
{% block title %}Subir Documento{% endblock %}

{% block content %}

<style>

.upload-wrapper {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
}

.upload-card {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 20px;
    padding: 45px;
    color: #222;
    position: relative;
    box-shadow: 0 8px 32px rgba(60,60,100,0.10);
    border: 1px solid #e0e7ef;
}

.upload-card h3 {
    text-align: center;
    margin-bottom: 35px;
    font-weight: 600;
}

.form-label {
    font-weight: 500;
}

.form-control {
    background: #fff;
    border: 1px solid #e0e7ef;
    border-radius: 40px;
    padding: 12px 20px;
    color: #222;
}

.form-control:focus {
    background: #fff;
    border-color: #ffd54f;
    box-shadow: 0 0 10px #ffe08280;
    color: #222;
}

.upload-btn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border-radius: 40px;
    border: none;
    font-weight: 500;
    color: #222;
    background: #00aab1; color: #fff;
    box-shadow: 0 8px 24px rgba(60,60,100,0.10);
    transition: 0.3s ease;
}

.upload-btn:hover {
    transform: scale(1.05);
}

</style>

<div class="upload-wrapper">

    <div class="upload-card">

        <h3>📤 Subir Documento PDF</h3>

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-4">
                <label class="form-label">
                    ID Asociado (máx 11 dígitos)
                </label>
                <input type="text"
                       name="identificador"
                       maxlength="11"
                       class="form-control"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Archivo PDF
                </label>
                <input type="file"
                       name="file"
                       accept=".pdf"
                       class="form-control"
                       required>
            </div>

            <button class="upload-btn">
                Subir Documento
            </button>

        </form>

    </div>

</div>

{% endblock %}
