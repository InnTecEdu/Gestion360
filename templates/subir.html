{% extends "base.html" %}
{% block title %}Subir Documento{% endblock %}

{% block content %}

<style>

.upload-wrapper {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.upload-card {
    width: 100%;
    max-width: 520px;

    background: linear-gradient(
        145deg,
        rgba(90, 70, 180, 0.95),
        rgba(46, 42, 94, 0.95)
    );

    border-radius: 30px;
    padding: 45px;
    color: white;
    position: relative;

    box-shadow:
        0 25px 60px rgba(0,0,0,0.55),
        inset 0 1px 2px rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.08);
}

.upload-card h3 {
    text-align: center;
    margin-bottom: 35px;
    font-weight: 600;
}

.form-label {
    font-weight: 500;
}

.form-control {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 40px;
    padding: 12px 20px;
    color: white;
}

.form-control:focus {
    background: rgba(255,255,255,0.12);
    border-color: #ffb347;
    box-shadow: 0 0 10px rgba(255,179,71,0.5);
    color: white;
}

.upload-btn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border-radius: 40px;
    border: none;
    font-weight: 500;
    color: white;

    background: linear-gradient(
        90deg,
        #ffb347,
        #ff9800
    );

    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    transition: 0.3s ease;
}

.upload-btn:hover {
    transform: scale(1.05);
}

</style>

<div class="upload-wrapper">

    <div class="upload-card">

        <h3>📤 Subir Documento PDF</h3>

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-4">
                <label class="form-label">
                    ID Asociado (máx 11 dígitos)
                </label>
                <input type="text"
                       name="identificador"
                       maxlength="11"
                       class="form-control"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Archivo PDF
                </label>
                <input type="file"
                       name="file"
                       accept=".pdf"
                       class="form-control"
                       required>
            </div>

            <button class="upload-btn">
                Subir Documento
            </button>

        </form>

    </div>

</div>

{% endblock %}
