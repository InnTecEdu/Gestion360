{% extends "base.html" %}
{% block title %}Usuarios{% endblock %}

{% block content %}
<style>
    /* Card morada */
.card-morada {
    background-color: #fff;
    border: 1px solid #00aab1;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(60,60,100,0.10);
}

/* Header */
.header-morado {
    background-color: #e0e7ef !important;
    color: #222;
    font-weight: bold;
}

/* Tabla morada */
.tabla-morada {
    color: #222;
    background: #fff;
}

.tabla-morada th {
    background-color: #e0e7ef !important;
    color: #222;
}

.tabla-morada td {
    background-color: #fff !important;
    color: #222;
}

/* Hover elegante */
.tabla-morada tbody tr:hover td {
    background-color: #00aab1 !important; color: #fff;
    transition: 0.2s;
}

</style>
<div class="card card-morada shadow">
    <div class="card-header header-morado">
        Gestión de Usuarios
        <a href="{{ url_for('user.crear_usuario') }}" 
           class="btn btn-sm btn-success float-end">
           + Crear Usuario
        </a>
    </div>

    <div class="card-body">
        <table class="table tabla-morada">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for u in usuarios %}
                <tr>
                          <td>{{ u.id }}</td>
                          <td>{{ u.username }}</td>
                          <td>{{ u.rol }}</td>
                    <td>
                                <a href="{{ url_for('user.editar_usuario', user_id=u.id) }}" 
                           class="btn btn-sm btn-primary">
                           Editar
                        </a>

                                <a href="{{ url_for('user.eliminar_usuario', user_id=u.id) }}" 
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('¿Eliminar usuario?')">
                           Eliminar
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>


{% endblock %}
