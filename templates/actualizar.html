{% extends "base.html" %}
{% block title %}Actualizar Documento{% endblock %}

{% block content %}


<div class="card shadow" style="background:#fff; border-radius:16px; border:1px solid #00aab1;">
    <div class="card-header" style="background:#00aab1; color:#fff; font-weight:bold;">
        Actualizar Documento
    </div>
    <div class="card-body">

        <p><strong>Documento actual:</strong> {{ doc.nombre_original }}</p>

        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <input type="file" name="file" class="form-control" style="background:#f8fafc; color:#222; border:1px solid #e0e7ef;" required>
            </div>
            <button class="btn btn-success">Actualizar</button>
            <a href="{{ url_for('document.buscar') }}" class="btn btn-secondary">
                Cancelar
            </a>
        </form>

    </div>
</div>

{% endblock %}
