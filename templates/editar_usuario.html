{% extends "base.html" %}
{% block title %}Editar Usuario{% endblock %}
{% block content %}

<div class="card shadow" style="background:#fff; border-radius:16px; border:1px solid #00aab1;">
    <div class="card-header" style="background:#00aab1; color:#fff; font-weight:bold;">
        Editar Usuario
    </div>

    <div class="card-body">
        <form method="POST">

            <div class="mb-3">
                <label>Usuario</label>
                <input type="text" name="username" 
                      value="{{ usuario.username }}" 
                       class="form-control" style="background:#f8fafc; color:#222; border:1px solid #e0e7ef;" required>
            </div>

            <div class="mb-3">
                <label>Rol</label>
                <select name="rol" class="form-select" style="background:#f8fafc; color:#222; border:1px solid #e0e7ef;">
                    <option value="usuario" {% if usuario.rol=='usuario' %}selected{% endif %}>
                        Usuario
                    </option>
                    <option value="admin" {% if usuario.rol=='admin' %}selected{% endif %}>
                        Admin
                    </option>
                </select>
            </div>

            <button class="btn btn-success">Guardar Cambios</button>
            <a href="{{ url_for('user.listar_usuarios') }}" class="btn btn-secondary">
                Cancelar
            </a>

        </form>
    </div>
</div>

{% endblock %}
